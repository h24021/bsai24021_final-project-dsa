<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <h1 class="site-title">My Library Dashboard</h1>
            <div class="user-info">
                <span id="welcomeMessage" class="welcome-text"></span>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </div>
        <div class="title-accent"></div>
    </header>

    <nav class="main-tabs">
        <button class="main-tab active" data-section="books">Browse Books</button>
        <button class="main-tab" data-section="myborrowed">My Borrowed Books</button>
        <button class="main-tab" data-section="search">Search</button>
        <button class="main-tab" data-section="profile">My Profile</button>
    </nav>

    <main class="main-content">
        <section id="books-section" class="content-section active">
            <h2 class="section-title">Available Books</h2>
            
            <div id="allBooksGrid" class="books-grid"></div>
        </section>

        <section id="myborrowed-section" class="content-section">
            <h2 class="section-title">My Borrowed Books</h2>
            
            <div class="borrow-section">
                <div class="borrow-box">
                    <h3>Borrow a Book</h3>
                    <p>Enter the Book ID to borrow a book from the library</p>
                    <div class="borrow-input-group">
                        <input type="number" id="borrowBookID" placeholder="Enter Book ID" class="borrow-input">
                        <button onclick="borrowBookByID()" class="btn-primary">Borrow Book</button>
                    </div>
                </div>
            </div>
            
            <div class="management-container">
                <h3 style="color: var(--white); margin-bottom: 1rem;">Currently Borrowed</h3>
                <div id="myBorrowedList" class="list-container"></div>
            </div>
        </section>

        <section id="search-section" class="content-section">
            <h2 class="section-title">Search Books</h2>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search by title, author, or genre..." class="search-input">
                <button onclick="searchBooks()" class="btn-primary">Search</button>
            </div>
            <div id="searchResults" class="books-grid"></div>
        </section>

        <section id="profile-section" class="content-section">
            <h2 class="section-title">My Profile</h2>
            <div class="profile-container">
                <div class="profile-card">
                    <h3>Account Information</h3>
                    <div class="profile-info">
                        <div class="info-row">
                            <span class="info-label">Name:</span>
                            <span id="profileName" class="info-value"></span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Username:</span>
                            <span id="profileUsername" class="info-value"></span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Email:</span>
                            <span id="profileEmail" class="info-value"></span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Role:</span>
                            <span id="profileRole" class="info-value">User</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">User ID:</span>
                            <span id="profileUserID" class="info-value"></span>
                        </div>
                    </div>
                </div>

                <div class="profile-card">
                    <h3>Borrowing Statistics</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="currentlyBorrowed">0</div>
                            <div class="stat-label">Currently Borrowed</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <style>
        .profile-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        .profile-card {
            background: var(--dark-gray);
            border: 1px solid var(--mid-gray);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .profile-card h3 {
            color: var(--white);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--deep-maroon);
            padding-bottom: 0.5rem;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem;
            background: var(--black);
            border-radius: 4px;
        }

        .info-label {
            color: var(--light-gray);
            font-weight: 500;
        }

        .info-value {
            color: var(--white);
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .stat-item {
            background: var(--black);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--mid-gray);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--deep-maroon);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--light-gray);
            font-size: 0.9rem;
        }

        .search-container {
            max-width: 800px;
            margin: 2rem auto;
            display: flex;
            gap: 1rem;
        }

        .search-input {
            flex: 1;
            padding: 1rem;
            background: var(--dark-gray);
            border: 1px solid var(--mid-gray);
            border-radius: 4px;
            color: var(--white);
            font-size: 1rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--deep-maroon);
        }

        .list-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .borrowed-item {
            background: var(--dark-gray);
            border: 1px solid var(--mid-gray);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .borrowed-item-info h3 {
            color: var(--white);
            margin-bottom: 0.5rem;
        }

        .borrowed-item-info p {
            color: var(--light-gray);
            font-size: 0.9rem;
            margin: 0.25rem 0;
        }

        .borrowed-date {
            color: var(--deep-maroon);
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--light-gray);
        }

        .empty-state h3 {
            color: var(--white);
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .btn-borrow {
            width: 100%;
            padding: 0.75rem;
            margin-top: 1rem;
            background: var(--deep-maroon);
            color: var(--white);
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-borrow:hover {
            background: #9b2828;
            transform: translateY(-2px);
        }

        .btn-return {
            padding: 0.75rem 1.5rem;
            background: #28a745;
            color: var(--white);
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-return:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn-disabled {
            width: 100%;
            padding: 0.75rem;
            margin-top: 1rem;
            background: var(--mid-gray);
            color: var(--light-gray);
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: not-allowed;
        }

        .borrow-section {
            max-width: 800px;
            margin: 2rem auto;
        }

        .borrow-box {
            background: var(--dark-gray);
            border: 2px solid var(--deep-maroon);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .borrow-box h3 {
            color: var(--white);
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }

        .borrow-box p {
            color: var(--light-gray);
            margin-bottom: 1.5rem;
        }

        .borrow-input-group {
            display: flex;
            gap: 1rem;
        }

        .borrow-input {
            flex: 1;
            padding: 1rem;
            background: var(--black);
            border: 1px solid var(--mid-gray);
            border-radius: 4px;
            color: var(--white);
            font-size: 1rem;
        }

        .borrow-input:focus {
            outline: none;
            border-color: var(--deep-maroon);
        }

        .borrow-input::placeholder {
            color: var(--light-gray);
        }
    </style>

    <script src="api-config.js"></script>
    <script src="user-dashboard.js"></script>
</body>
</html>
