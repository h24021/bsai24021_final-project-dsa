<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - Library System</title>
    <script>
        // Clear all stored data
        localStorage.clear();
        sessionStorage.clear();
        
        // Redirect to login page after a brief moment
        setTimeout(() => {
            window.location.href = '/login.html';
        }, 500);
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .message {
            text-align: center;
        }
        h1 {
            color: #6B0F1A;
        }
    </style>
</head>
<body>
    <div class="message">
        <h1>Logging out...</h1>
        <p>You will be redirected to the login page.</p>
    </div>
</body>
</html>
